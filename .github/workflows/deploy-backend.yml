name: 🚀 Deploy Backend to Azure Container Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name:  Login to Azure Container Registry
        run: |
          az acr login --name aasareregistry

      - name: Build and Push Docker image
        run: |
          cd backend
          docker buildx build --platform linux/amd64 \
            -t ${{ secrets.AZURE_CONTAINER_REGISTRY }}/aasare-backend:latest . --push

      - name:  Deploy to Azure Container App
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_CONTAINER_APP }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}/aasare-backend:latest \
            --set-env-vars \
              MONGO_URI="${{ secrets.MONGO_URI }}" \
              GOOGLE_API_KEY="${{ secrets.GOOGLE_API_KEY }}" \
              SECRET_KEY="${{ secrets.SECRET_KEY }}" similarly for backend
