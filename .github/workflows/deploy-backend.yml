name: 🚀 Deploy Backend to Azure Container Apps

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - uses: actions/checkout@v4

      # 2️⃣ Azure login
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3️⃣ Login to ACR (for docker push)
      - name: Login to Azure Container Registry
        run: az acr login --name aasareregistry

      # 4️⃣ Build & Push image
      - name: Build and Push Docker image
        run: |
          cd backend
          docker buildx build --platform linux/amd64 \
            -t ${{ secrets.AZURE_CONTAINER_REGISTRY }}/aasare-backend:latest \
            . --push

      # 5️⃣ Create Backend App if missing (WITH registry auth)
      - name: Create Backend Container App if not exists
        run: |
          if ! az containerapp show \
            --name ${{ secrets.AZURE_CONTAINER_APP }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} > /dev/null 2>&1; then

            az containerapp create \
              --name ${{ secrets.AZURE_CONTAINER_APP }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --environment aasare-env \
              --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}/aasare-backend:latest \
              --target-port 8080 \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 1 \
              --registry-server ${{ secrets.AZURE_CONTAINER_REGISTRY }} \
              --registry-username ${{ secrets.ACR_USERNAME }} \
              --registry-password ${{ secrets.ACR_PASSWORD }} \
              --env-vars \
                MONGO_URI="${{ secrets.MONGO_URI }}" \
                GOOGLE_API_KEY="${{ secrets.GOOGLE_API_KEY }}" \
                SECRET_KEY="${{ secrets.SECRET_KEY }}"
          fi

      # 6️⃣ Update image ONLY (NO registry flags)
      - name: Deploy Backend
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_CONTAINER_APP }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}/aasare-backend:latest \
            --set-env-vars \
              MONGO_URI="${{ secrets.MONGO_URI }}" \
              GOOGLE_API_KEY="${{ secrets.GOOGLE_API_KEY }}" \
              SECRET_KEY="${{ secrets.SECRET_KEY }}"
