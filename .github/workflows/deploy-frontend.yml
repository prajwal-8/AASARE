name: Deploy Frontend to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3️⃣ Login to Azure Container Registry
      - name: Login to Azure Container Registry
        run: az acr login --name aasareregistry

      # 4️⃣ Build & Push Docker image to ACR
      - name: Build and Push Docker image
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
        run: |
          cd frontend
          echo "REACT_APP_API_URL=$REACT_APP_API_URL" > .env
          docker buildx build --platform linux/amd64 \
            -t ${{ secrets.AZURE_CONTAINER_REGISTRY }}/aasare-frontend:latest \
            . --push

      # 5️⃣ Create Container App IF NOT EXISTS
      - name: Create Container App if not exists
        run: |
          if ! az containerapp show \
            --name aasare-frontend \
            --resource-group aasare-group > /dev/null 2>&1; then

            echo "Container App not found. Creating..."

            az containerapp create \
              --name aasare-frontend \
              --resource-group aasare-group \
              --environment aasare-env \
              --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}/aasare-frontend:latest \
              --target-port 80 \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 1
          else
            echo "Container App already exists."
          fi

      # 6️⃣ Update Container App (Deploy)
      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name aasare-frontend \
            --resource-group aasare-group \
            --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}/aasare-frontend:latest
