name: Deploy Frontend to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name aasareregistry

      - name: Build and Push Docker image
        run: |
          cd frontend
          docker buildx build --platform linux/amd64 \
            -t ${{ secrets.AZURE_CONTAINER_REGISTRY }}/aasare-frontend:latest . --push

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name aasare-frontend \
            --resource-group aasare-group \
            --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}/aasare-frontend:latest
